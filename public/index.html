<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rahi Mini MD – Pair</title>
<style>
  :root{--bg:#0b141a;--card:#111b21;--line:#233138;--text:#e9edef;--mute:#8696a0;--green:#25d366;--red:#f15c6d;--amber:#f5b942}
  @media (prefers-color-scheme:light){:root{--bg:#f0f2f5;--card:#fff;--line:#d9dee2;--text:#111b21;--mute:#667781}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
  h1{margin:0 0 4px;font-size:22px}
  p.sub{margin:0 0 22px;color:var(--mute);font-size:14px}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
  input{width:100%;padding:12px 14px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);letter-spacing:.5px}
  input:focus{outline:2px solid var(--green);outline-offset:1px}
  button{width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--green);color:#052e16;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .hint{font-size:12px;color:var(--mute);margin-top:6px}
  #result{display:none;margin-top:22px;text-align:center}
  .code{font:700 34px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;padding:16px 8px;border:1px dashed var(--green);border-radius:12px;cursor:pointer;user-select:all}
  .status{margin-top:14px;font-size:14px}
  .ok{color:var(--green)}.err{color:var(--red)}.wait{color:var(--amber)}
  ol{text-align:left;color:var(--mute);font-size:13px;padding-left:20px;margin:16px 0 0}
  #msg{margin-top:12px;font-size:14px;min-height:1.4em}
</style>
</head>
<body>
<main>
  <h1>Rahi Mini MD</h1>
  <p class="sub">Link your WhatsApp with a pairing code.</p>

  <form id="form" autocomplete="off">
    <label for="phone">WhatsApp number (with country code, no +)</label>
    <input id="phone" inputmode="numeric" placeholder="8801XXXXXXXXX" maxlength="20" required>
    <div class="hint">Example: 8801712345678 (Bangladesh), 919812345678 (India)</div>
    <button id="go" type="submit">Get pairing code</button>
  </form>
  <div id="msg" class="err" role="alert"></div>

  <section id="result">
    <div class="code" id="code" title="Tap to copy"></div>
    <div class="status wait" id="status">Waiting for you to enter the code…</div>
    <ol>
      <li>Open WhatsApp → Settings → Linked devices</li>
      <li>Tap <b>Link a device</b> → <b>Link with phone number instead</b></li>
      <li>Enter the code above (valid ~3 minutes)</li>
    </ol>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;

function setMsg(t){ $("msg").textContent = t || ""; }

function stopPolling(){ if (timer) { clearInterval(timer); timer = null; } }

async function getJSON(url){
  const r = await fetch(url);
  let j = {};
  try { j = await r.json(); } catch {}
  return { status: r.status, ...j };
}

function poll(sid){
  const started = Date.now();
  const st = $("status");
  timer = setInterval(async () => {
    try {
      const r = await getJSON("/session/" + encodeURIComponent(sid));
      if (r.status === 200 && r.running) {
        stopPolling();
        st.className = "status ok";
        st.textContent = "✅ Paired! Your bot is now connected to WhatsApp.";
        $("go").disabled = false;
      } else if (r.status === 404 || Date.now() - started > 190000) {
        stopPolling();
        st.className = "status err";
        st.textContent = "Pairing expired or failed. Please try again.";
        $("go").disabled = false;
      }
    } catch { /* network blip, keep polling */ }
  }, 2500);
}

$("code").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("code").textContent); setMsg(""); $("code").title = "Copied!"; } catch {}
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  stopPolling();
  setMsg("");
  const phone = $("phone").value.replace(/\D/g, "");
  if (!/^[1-9][0-9]{6,14}$/.test(phone)) return setMsg("Enter a valid number with country code, digits only.");

  $("go").disabled = true;
  $("go").textContent = "Generating…";
  $("result").style.display = "none";
  try {
    const r = await getJSON("/pair/" + phone);
    if (!r.ok) {
      setMsg(r.error || "Something went wrong.");
      $("go").disabled = false;
      return;
    }
    $("code").textContent = r.code;
    $("status").className = "status wait";
    $("status").textContent = "Waiting for you to enter the code…";
    $("result").style.display = "block";
    poll(r.sessionId);
  } catch {
    setMsg("Network error. Try again.");
    $("go").disabled = false;
  } finally {
    $("go").textContent = "Get pairing code";
  }
});
</script>
</body>
</html>
